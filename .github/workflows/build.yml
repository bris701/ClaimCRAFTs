name: Windows source build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore packages
        run: dotnet restore ClaimCRAFTs/ClaimCRAFTs.csproj
      - name: Compile WPF application
        run: dotnet build ClaimCRAFTs/ClaimCRAFTs.csproj --configuration Release --no-restore
